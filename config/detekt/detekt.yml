# Configuración de detekt para MobileVynils.
# Se aplica sobre la configuración por defecto (buildUponDefaultConfig = true):
# aquí solo van los ajustes propios del proyecto. Reglas: docs/03-lineamientos-kotlin.md.

build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

complexity:
  LongMethod:
    threshold: 60
    ignoreAnnotated: ['Composable', 'Preview']
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 8
    ignoreAnnotated: ['Composable', 'Inject']
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInClasses: 20
    thresholdInInterfaces: 20
    thresholdInObjects: 20
    ignorePrivate: true
    ignoreOverridden: true
  CyclomaticComplexMethod:
    threshold: 15
  NestedBlockDepth:
    threshold: 4

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable', 'Preview']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Z0-9]*'
  MatchingDeclarationName:
    mustBeFirst: true

style:
  MagicNumber:
    ignoreAnnotated: ['Composable', 'Preview']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreEnums: true
    ignoreNumbers: ['-1', '0', '1', '2']
  MaxLineLength:
    maxLineLength: 120
    excludeCommentStatements: true
  ReturnCount:
    max: 3
    excludeGuardClauses: true
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  ForbiddenComment:
    comments:
      - reason: 'Registra la deuda como issue en GitHub en lugar de un comentario.'
        value: 'FIXME'
      - reason: 'Registra la deuda como issue en GitHub en lugar de un comentario.'
        value: 'STOPSHIP'
  WildcardImport:
    active: true
  UnnecessaryAbstractClass:
    active: true
  # Stack cerrado (docs/01, 02, 05 y 10): solo Material 3, Navigation Compose 2.x,
  # StateFlow y Hilt. Los iconos de material.icons sí se permiten.
  ForbiddenImport:
    active: true
    imports:
      - value: 'androidx.lifecycle.LiveData'
        reason: 'Solo Flow/StateFlow (docs/02-arquitectura.md, sección 2).'
      - value: 'androidx.lifecycle.MutableLiveData'
        reason: 'Solo Flow/StateFlow (docs/02-arquitectura.md, sección 2).'
      - value: 'androidx.lifecycle.LiveDataKt'
        reason: 'Solo Flow/StateFlow (docs/02-arquitectura.md, sección 2).'
      - value: 'androidx.navigation3.*'
        reason: 'Navigation Compose 2.x con rutas tipadas (docs/10, sección 3).'
      - value: 'androidx.fragment.*'
        reason: 'Toda la UI es Compose; sin Fragments (docs/05, sección 1).'
      - value: 'kotlinx.coroutines.GlobalScope'
        reason: 'Usa viewModelScope o un scope inyectado (docs/02, sección 7).'
      - value: 'org.koin.*'
        reason: 'La inyección es con Hilt (docs/02, sección 6).'
      - value: 'android.util.Log'
        reason: 'Los registros van por Timber (docs/01-stack-y-versiones.md), sin logs en release.'
    forbiddenPatterns: '^androidx\.compose\.material\.(?!icons)'

exceptions:
  TooGenericExceptionCaught:
    active: true
    exceptionNames:
      - Error
      - Exception
      - RuntimeException
      - Throwable
    allowedExceptionNameRegex: '_|(ignore|expected).*'
  SwallowedException:
    active: true
    ignoredExceptionTypes:
      - CancellationException

coroutines:
  GlobalCoroutineUsage:
    active: true
  InjectDispatcher:
    active: true
    dispatcherNames: ['IO', 'Default', 'Unconfined']
  SuspendFunWithFlowReturnType:
    active: true
  SleepInsteadOfDelay:
    active: true

