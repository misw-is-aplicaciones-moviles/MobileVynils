services:
  db:
    image: postgres:17
    pull_policy: never
    environment:
      POSTGRES_DB: vinilos_e2e
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: e2e_only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d vinilos_e2e']
      interval: 1s
      timeout: 3s
      retries: 45
    mem_limit: 256m
  backend:
    image: ${E2E_BACKEND_IMAGE:-backvynils-web:latest}
    pull_policy: never
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASS: e2e_only
      DB_NAME: vinilos_e2e
      USE_SSL: 'false'
    ports:
      - '127.0.0.1::3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://127.0.0.1:3000/albums',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 1s
      timeout: 3s
      retries: 60
    mem_limit: 512m
