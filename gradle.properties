# Memoria y codificación de la JVM de Gradle. preferIPv4Stack evita fallos de DNS de la JVM
# con hosts que solo publican AAAA (plugins-artifacts.gradle.org) en redes sin IPv6 real.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC -Djava.net.preferIPv4Stack=true

# Rendimiento del build (docs/07-desempeno.md).
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# Android.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin.
kotlin.code.style=official
